<!DOCTYPE html>
<html lang="en">
<head>
    <title>My Animal Fact File</title>
    <style>

        /* Page background -sets the colour and font for the whol page */
        bady{
            background-color: darkgreen;
            font-family: Arial, snas-serif;

        }
        /*Box Model - width sets  the content area
        padding pushes the text away from the edges
        border draws a visible frame around the fact file
        margin pushes the fact file away from the screen edge */
    .fact-file {
        background-color: lightyellow;
        color: darkslategray;
        width: 260px;
        padding: 25px;
        border: 4px solid forestgreen;
        margin: 30px;
    }
    /* Animal name -forestgreen so it stands out */
    animal-name {
        color: forestgreen;
        font-size: 22px;

    }

    /* Detail rows - dark text on the light dackground */
    .detail {
        color: darkslategray;
    }

    /* Cool Fact- orange anditalic to make it feel special */
    .cool-fact {
        color: darkorange;
        font-style: italic;
    }

    </style>
</head>
<body>
    
    <div class="fact-file">
        <h1="animal-name">Snow Leopard</h1>
        <p class="detail">Type: Big Cat</p>
        <p class="="detail">Live in: Mountain ranges of Central Asia</p>
        <p class="detail">Diet: Dear, goats, and wild sheep</p>
        <p class="cool-fact">Cool Fact: Can leap up to 15 meters in one jump!</p>
    </div>
    
</body>
</html>
